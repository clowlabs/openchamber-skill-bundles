  <style>
    html { font-size: 0.875rem; }
    html, body { margin: 0; background: transparent; color: var(--oc-fg); font-family: var(--oc-font, system-ui, sans-serif); }
    /* The Work Status section already frames this: no outer card, just padding. */
    /* The host already insets the frame like its rows (mx-1), so no horizontal padding here. */
    #section { padding: 0; cursor: pointer; border-radius: 6px; }
    #section:hover .skm-icon { color: var(--oc-fg); }
    #section:hover .skm-rest, #section:hover .skm-tokens { color: var(--oc-fg); }
    #section:focus-visible { outline: 1px solid var(--oc-focus, var(--oc-primary)); outline-offset: -1px; }
    .err { color: var(--oc-error-text, var(--oc-error)); font-size: 12px; }
  </style>
</head>
