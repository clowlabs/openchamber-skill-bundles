<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skills</title>
  <link rel="stylesheet" href="meter.css" />
  <style>
    html, body { margin: 0; background: transparent; color: var(--oc-fg); font-family: var(--oc-font, system-ui, sans-serif); }
    /* The Work Status section already frames this: no outer card, just padding. */
    #section { padding: 12px; cursor: pointer; border-radius: 6px; }
    #section:hover .skm-rest, #section:hover .skm-tokens { color: var(--oc-fg); }
    #section:focus-visible { outline: 2px solid var(--oc-focus, var(--oc-primary)); outline-offset: -2px; }
    .err { color: var(--oc-error-text, var(--oc-error)); font-size: 12px; }
  </style>
</head>
<body>
  <div id="section" role="button" tabindex="0" title="Open Skill Bundles" aria-label="Skills. Open Skill Bundles">
    <div id="head"><span class="skm-sub">Counting skills…</span></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
