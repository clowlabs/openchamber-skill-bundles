<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skills</title>
  <style>
    html, body { margin: 0; background: transparent; color: var(--oc-fg); font-family: var(--oc-font, system-ui, sans-serif); }
    #line { display: block; width: 100%; box-sizing: border-box; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 6px 10px; cursor: pointer; border-radius: 6px; }
    #line:hover { background: var(--oc-hover); }
    #line:focus-visible { outline: 2px solid var(--oc-focus, var(--oc-primary)); outline-offset: -2px; }
    .main { font-size: 13px; font-weight: 600; }
    .main .n { font-variant-numeric: tabular-nums; }
    .sub { font-size: 11px; color: var(--oc-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .err { color: var(--oc-error-text, var(--oc-error)); }
  </style>
</head>
<body>
  <button id="line" type="button" title="Open Skill Bundles">
    <div class="main" id="main">Counting skills…</div>
    <div class="sub" id="sub"></div>
  </button>
  <script src="main.js"></script>
</body>
</html>
